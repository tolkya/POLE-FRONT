<p-tabs value="info">
  <p-tablist>
    <p-tab value="info">Infos club</p-tab>
    <p-tab value="members">Membres ({{ members().length }})</p-tab>
    <p-tab value="activities">Activités ({{ activities().length }})</p-tab>
  </p-tablist>

  <p-tabpanels>
    <p-tabpanel value="info">
      @if (clubDetails(); as club) {
        @if (editing()) {
          <form class="edit-form" [formGroup]="editForm" (ngSubmit)="saveClub()">
            <div class="form-group">
              <label>Nom du club *</label>
              <input type="text" formControlName="name" />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" formControlName="email" />
            </div>
            <div class="form-group">
              <label>Téléphone</label>
              <input type="text" formControlName="phone" />
            </div>
            <div class="form-actions">
              <button type="button" class="btn-secondary" (click)="cancelEdit()">Annuler</button>
              <button type="submit" class="btn-primary" [disabled]="editForm.invalid || saving()">
                {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
              </button>
            </div>
          </form>
        } @else {
          <div class="club-card">
            <h2>{{ club.name }}</h2>
            <p><strong>Email :</strong> {{ club.email || 'Non renseigné' }}</p>
            <p><strong>Téléphone :</strong> {{ club.phone || 'Non renseigné' }}</p>
            <p><strong>Code d'invitation :</strong> <code class="club-code">{{ club.clubCode }}</code></p>
            <button class="btn-secondary btn-edit" (click)="startEdit()">Modifier</button>
          </div>
        }
      }
    </p-tabpanel>

    <p-tabpanel value="members">
      <app-members-tab
        [members]="members()"
        (validate)="onValidateMember($event)"
        (changeRoles)="onChangeRole($event)"
        (remove)="onRemoveMember($event)"
      />
    </p-tabpanel>

    <p-tabpanel value="activities">
      <app-activities-tab
        [clubId]="userClub().club.id"
        [activities]="activities()"
        (activityCreated)="onActivityCreated($event)"
        (activityDeleted)="onActivityDeleted($event)"
      />
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
