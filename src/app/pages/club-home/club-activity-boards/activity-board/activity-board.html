<section class="activity-board">
  <div class="activity-board__header">
    @if (activityType().medias.length > 0) {
      <div class="activity-board__header-img">
        <img [src]="activityType().medias[0].mediaUrl" [alt]="activityType().name" />
      </div>
    }
    <div class="activity-board__header-content">
      <h3 class="activity-board__title">{{ activityType().name }}</h3>
      @if (activityType().description) {
        <p class="activity-board__description">{{ activityType().description }}</p>
      }
    </div>
  </div>

  @if (activities().length === 0) {
    <p class="activity-board__empty">Aucune activité dans cette discipline.</p>
  } @else {
    <div class="activity-board__grid">
      @for (activity of activities(); track activity.id) {
        <app-activity-card
          [activity]="activity"
          [userRole]="userRole()"
          [myActivities]="myActivities()"
          (joined)="onJoined()"
        />
      }
    </div>
  }
</section>
