@if (loading()) {
  <div class="club-home">
    <p-skeleton height="160px" borderRadius="12px" />
    <div class="club-home__stats-skeleton">
      <p-skeleton height="80px" />
      <p-skeleton height="80px" />
      <p-skeleton height="80px" />
    </div>
  </div>
} @else if (club()) {
  <div class="club-home">
    <app-club-hero
      [club]="club()!"
      [activityTypes]="activityTypes()"
      [userRole]="userRole()"
      [logoUrl]="logoAbsoluteUrl()"
      (themeColorChange)="onThemeChange($event)"
      (leaveClub)="onLeaveClub()"
      (joinClub)="onJoinClub()"
      (navigateToSettings)="onEditClub()"
    />

    <app-club-stats
      [membersCount]="membersCount()"
      [activitiesCount]="activitiesCount()"
      [teachersCount]="teachersCount()"
    />

    <app-club-activity-boards
      [clubId]="club()!.id"
      [userRole]="userRole()"
      (activitiesCountChange)="onActivitiesCountChange($event)"
    />

    <app-join-club-dialog
      [visible]="showJoinDialog()"
      (visibleChange)="showJoinDialog.set($event)"
      (joined)="onJoined()"
    />

    <app-club-edit-dialog
      [club]="club()!"
      [visible]="showEditDialog()"
      (visibleChange)="showEditDialog.set($event)"
      (save)="onSaveClub($event)"
    />
  </div>
}
