@if (loading()) {
  <div class="club-home">
    <p-skeleton height="160px" borderRadius="12px" />
    <div class="club-home__stats-skeleton">
      <p-skeleton height="80px" />
      <p-skeleton height="80px" />
      <p-skeleton height="80px" />
    </div>
  </div>
} @else if (club()) {
  <div class="club-home">
    <app-club-hero
      [club]="club()!"
      [activityTypes]="activityTypes()"
      [userRole]="userRole()"
      [isPending]="isPendingMember()"
      [logoUrl]="logoAbsoluteUrl()"
      (themeColorChange)="onThemeChange($event)"
      (leaveClub)="onLeaveClub()"
      (joinClub)="onJoinClub()"
      (cancelRequest)="onCancelRequest()"
      (navigateToSettings)="onEditClub()"
    />

    @if (isPendingMember()) {
      <div class="club-home__pending-notice">
        <i class="pi pi-clock"></i>
        <p>Votre demande d'adhésion est en attente de validation par l'administrateur du club.</p>
      </div>
    } @else if (isMember() || club()!.joinPolicy === 'AUTO_ACCEPT') {
      <app-club-stats
        [membersCount]="membersCount()"
        [activitiesCount]="activitiesCount()"
        [teachersCount]="teachersCount()"
      />
      <app-club-activity-boards
        [clubId]="club()!.id"
        [userRole]="userRole()"
        (activitiesCountChange)="onActivitiesCountChange($event)"
      />
    } @else {
      <div class="club-home__private-notice">
        <i class="pi pi-lock"></i>
        <p>Club privé — inscrivez-vous pour accéder au contenu.</p>
      </div>
    }

    <app-join-club-dialog
      [visible]="showJoinDialog()"
      (visibleChange)="showJoinDialog.set($event)"
      (joined)="onJoined()"
    />
  </div>
}
