<p-dialog
  [visible]="visible$()"
  (visibleChange)="onHide()"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '480px' }"
  [header]="isEdit ? 'Modifier le niveau' : 'Ajouter un niveau'"
>
  @if (showContent()) {
    <div class="level-form">

      <div class="level-form__field">
        <label class="level-form__label">Nom du niveau *</label>
        <input
          type="text"
          pInputText
          placeholder="Ex: Débutant, Bronze, Inter 1..."
          maxlength="100"
          [ngModel]="levelName()"
          (ngModelChange)="levelName.set($event)"
          class="level-form__input"
        />
        @if (levelName().trim().length === 0) {
          <span class="level-form__error">Le nom est obligatoire.</span>
        }
        @if (levelName().trim().length > 100) {
          <span class="level-form__error">100 caractères maximum.</span>
        }
      </div>

      <div class="level-form__field">
        <label class="level-form__label">Description <span class="level-form__optional">(facultatif)</span></label>
        <textarea
          pTextarea
          rows="3"
          placeholder="Décrivez ce niveau..."
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
          class="level-form__textarea"
        ></textarea>
      </div>

    </div>
  }

  <ng-template pTemplate="footer">
    <button pButton label="Annuler" severity="secondary" (click)="onHide()" [disabled]="saving()"></button>
    <button pButton
      [label]="isEdit ? 'Enregistrer' : 'Créer'"
      [loading]="saving()"
      [disabled]="!isValid"
      (click)="onSave()"
    ></button>
  </ng-template>
</p-dialog>
