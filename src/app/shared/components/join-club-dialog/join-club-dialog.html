<p-dialog
  header="Rejoindre un club"
  [visible]="visible$()"
  (visibleChange)="visible$.set($event); visibleChange.emit($event)"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '420px' }"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label>Code du club</label>
      <input type="text" formControlName="clubCode" placeholder="cde_42" />
    </div>
    @if (error()) { <p class="error">{{ error() }}</p> }
    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="visible$.set(false); visibleChange.emit(false)">Annuler</button>
      <button type="submit" class="btn-primary" [disabled]="form.invalid || pending()">
        {{ pending() ? 'Envoi...' : 'Rejoindre' }}
      </button>
    </div>
  </form>
</p-dialog>
