<p-toast position="top-right" />

<app-header />

@if (auth.isLoggedIn()) {
  <app-sidenav />

  <!-- Backdrop : clic en dehors de la sidenav pour la fermer -->
  @if (sidenav.expanded()) {
    <div class="app-backdrop" (click)="sidenav.close()"></div>
  }

  <main class="app-main" [class.app-main--expanded]="sidenav.expanded()">
    <router-outlet />
  </main>
} @else {
  <router-outlet />
}
