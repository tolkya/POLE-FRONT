services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        API_BASE_URL: ${API_BASE_URL}
    container_name: pole-front-node
    env_file:
      - .env
      - path: .env.dev
        required: false
    ports:
      - "4200:4200"
    volumes:
      # Monte le code source pour le hot reload
      - ./src:/app/src
      - ./public:/app/public
      # Exclut node_modules du volume (utilise ceux installés dans le container)
      - /app/node_modules
    environment:
      - NODE_ENV=development
